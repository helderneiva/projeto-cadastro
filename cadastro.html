<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="favicon.ico">
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bolder;
        }

        .campo{
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 10px;
        }

        .campo input{
            font-weight: normal;
            font-size: 15px;
        }

        #enviar, #sair{
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            margin-top: 10px;
            font-size: 15px;
            padding: 5px;
        }
    </style>
</head>
<body>
    <h1>Cadastre-se</h1>
    <form action="cadastro.php" autocomplete="on" method="post">
        <fieldset>
            <div class="campo">
                <label for="inome">Nome:</label>
                <input type="text" name="nome" id="inome" placeholder="nome" size="20" required autocomplete="name">
            </div>
            <div class="campo">
                <label for="isobrenome">Sobrenome</label>
                <input type="text" name="sobrenome" id="isobrenome" placeholder="sobrenome" required size="20" autocomplete="nickname">
            </div>
            <div class="campo">
                <label for="imail">E-mail:</label>
                <input type="email" name="email" id="imail" placeholder="e-mail" required autocomplete="email">
            </div>
            <div class="campo">
                <label for="itel">Telefone:</label>
                <input type="tel" name="tel" id="itel" autocomplete="tel" pattern="\(\d{2}\)\d{4,5}-\d{4}$" required placeholder="(xx)xxxxx-xxxx">
            </div>
            <div class="campo">
                <label for="iusu">Usuário:</label>
                <input type="text" name="usuario" id="iusu" required minlength="8" maxlength="15" size="20" placeholder="nome de usuario" autocomplete="username">
            </div>
            
            <div class="campo">
                <label for="isen">Senha:</label>
                <input type="password" name="senha" id="isen" required minlength="8" maxlength="20" size="20" placeholder="senha minimo 8 caracteres" autocomplete="current-password">
            </div>
        </fieldset>

        <input type="submit" value="Enviar" id="enviar">
        <input type="reset" value="Sair" id="sair">

    </form>
</body>
</html>
